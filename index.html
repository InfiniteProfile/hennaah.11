<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Hena — photo and video profile.">
  <title>Hena (@hennaah.11)</title>
  <link rel="stylesheet" href="style.css">
  <script src="posts.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="wordmark" href="./" aria-label="Hena profile">Instagram</a><div class="top-actions"><button id="themeToggle" class="icon-button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button></div></header>
  <main class="page-shell">
    <section class="profile-header" aria-label="Profile header">
      <div class="avatar-wrap"><img id="profilePhoto" class="profile-avatar" alt="Hena profile photo"></div>
      <div class="profile-details"><div class="profile-title"><h1>hennaah.11</h1><button class="follow-button" type="button" id="followButton">Follow</button><button class="icon-button" type="button" aria-label="More options">•••</button></div>
        <div class="stats"><span><strong id="postCount">0</strong> posts</span></div>
        <div class="display-name" id="displayName">Hena</div>
      </div>
    </section>
    <nav class="tabs" aria-label="Profile content"><button class="tab active" aria-label="Posts" title="Posts">▦ <span>POSTS</span></button><button class="tab" aria-label="Reels" title="Reels">▻ <span>REELS</span></button><button class="tab" aria-label="Tagged" title="Tagged">♙ <span>TAGGED</span></button></nav>
    <section id="grid" class="post-grid" aria-label="Posts"></section>
    <nav id="pagination" class="pagination" aria-label="Post pages"></nav>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Post viewer">
    <button id="closeViewer" class="viewer-close" aria-label="Close post">×</button>
    <button id="previousPost" class="post-step prev" aria-label="Previous post">‹</button>
    <article class="post-dialog">
      <div id="viewerMedia" class="viewer-media"></div>
      <aside class="post-sidebar"><header class="post-author"><img id="viewerAvatar" alt="" class="mini-avatar"><div><strong>hennaah.11</strong><small id="viewerDate"></small></div><button class="icon-button more-button" aria-label="More options">•••</button></header>
        <div id="viewerCaption" class="caption-area"></div>
        <div class="post-actions"><button id="likeButton" class="action-button" aria-label="Like post" title="Like">♡</button><button class="action-button" aria-label="Comment" title="Comment">▢</button><button id="shareButton" class="action-button" aria-label="Copy post link" title="Copy post link">➤</button><button id="saveButton" class="action-button save-action" aria-label="Save post" title="Save">♧</button></div>
        <div id="carouselControls" class="carousel-controls" hidden><button id="carouselPrev" aria-label="Previous media">‹</button><span id="carouselPosition">1/1</span><button id="carouselNext" aria-label="Next media">›</button></div>
        <div class="sidebar-footer"><span id="linkStatus"></span><span>Media from repository</span></div>
      </aside>
    </article>
    <button id="nextPost" class="post-step next" aria-label="Next post">›</button>
  </div>
</body>
</html>
